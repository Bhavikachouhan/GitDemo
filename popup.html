<!DOCTYPE html>
<html>
    <head>
        <title>Alert Confirm Prompt Example</title>
    </head>
    <body>
        <h2>Alert() Confirm() Prompt() Example</h2>
        
        <button onclick="showAlert()">showAlert</button>
        <button onclick="showConfirm()">showConfirm</button>
        <button onclick="showPrompt()">showPrompt</button>

        <p id="result"></p>

        <script>
            function showAlert(){
                alert("This is a alert message!");
            }

            function showConfirm(){
                let choice=confirm("Do you want to continue?");
                if(choice){
                    document.getElementById("result").innerText="ok";
                }else{
                    document.getElementById("result").innerText="cancle";
                }
            }

            function showPrompt(){
                let name=prompt("Enter your name");
                if(name===null){
                    document.getElementById("result").innerText="prompt cancelled";
                }else{
                    document.getElementById("result").innerText="Hello"+" "+name+"!";
                }
            }
        </script>
    </body>
</html>
