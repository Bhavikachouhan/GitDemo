<!DOCTYPE html>
<html>
    <head>
        <title>Array in js</title>
    </head>
    <body>
        <h3>Array Example</h3>
        <p id="arr"></p>
        <script>
            let fruites=["Apple","Banana","Cherry"];
            let output="Total Fruites:"+fruites.length+"<br>"+
            "Second Fruite:"+fruites[1];
            document.getElementById("arr").innerHTML=output;
        </script>
    </body>
</html>
