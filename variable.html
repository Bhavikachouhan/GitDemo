<!DOCTYPE html>
<html>
    <head>
        <title>Variable Declaration</title>
    </head>
    
    <body>

        <h2>Variable Declaration Example</h2>
        <p id="result"></p>

        <script>

            var a=10;
            let b=20;
            const c=30;
            
            let output="Var="+a+"<br>"+
            "Let="+b+"<br>"+
            "Const="+c;

            document.getElementById("result").innerHTML=output;
            
        </script>
    </body>
</html>
