<!DOCTYPE html>
<html>
    <body>
        <h2>control statement example</h2>
        <p id="ctrl"></p>

        <script>
            let num=10;
            let message=" ";
            if(num>0){
                message+="num is positive <br>";
            }else{
                message+="num is negative <br>"
            }
            message+="num from 1 to 5:";
            for(let i=1;i<6;i++){
                message+=i+" ";
            }

            let day=3;
            switch(day){
                case 1: message+="<br> Sunday";break;
                case 2: message+="<br> Monday";break;
                case 3: message+="<br> Tuesday";break;
                default:message+="<br> Invalid input";
            }
            document.getElementById("ctrl").innerHTML=message;
        </script>
    </body>
</html>
